name: Build for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (defaults to latest release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, Test, and Build Windows Packages
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run dist:win -- --publish never
          npm run installer-app

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $orderedPaths = @(
            "dist/Upscayl-Next-Setup-$version.exe",
            "dist/Upscayl-Next-Setup-$version.exe.blockmap",
            "dist/Upscayl-Next-Setup-$version.zip",
            "dist/latest.yml",
            "installer/dist/Upscayl-Next-Installer-$version.exe"
          )
          $lines = @()
          foreach ($rel in $orderedPaths) {
            if (-not (Test-Path $rel)) {
              throw "Expected build artifact is missing: $rel"
            }
            $item = Get-Item $rel
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($item.Name)"
          }
          $lines | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload Assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ inputs.tag }}"
          if (-not $tag) {
            $tag = gh release view --json tagName --jq .tagName
          }
          $assets = @(
            "dist/Upscayl-Next-Setup-$version.exe",
            "dist/Upscayl-Next-Setup-$version.exe.blockmap",
            "dist/Upscayl-Next-Setup-$version.zip",
            "dist/latest.yml",
            "installer/dist/Upscayl-Next-Installer-$version.exe",
            "dist/SHA256SUMS.txt"
          )
          gh release upload $tag @assets --clobber

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.blockmap
            dist/*.zip
            dist/*.exe
            dist/latest.yml
            dist/SHA256SUMS.txt
            installer/dist/*.exe
